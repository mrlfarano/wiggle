  - id: "001"
    title: "Define Technical Architecture"
    description: "DECISION RECORD — Tech stack & architecture (RESOLVED).\n\nChosen stack: C# / .NET 8 + WinUI 3 (native Windows 11).\nRationale: first-class access to the Windows media APIs that are essential to\nthis product's core differentiator (polished effects while capturing at 60fps\nwith a responsive UI), lowest runtime overhead, and fully buildable/runnable on\nthe Windows dev machine. macOS/Linux support is out of scope for v1.\n\nOptions evaluated:\n- C# / .NET + WinUI 3 (CHOSEN) — native WGC/Media Foundation/WASAPI, best perf.\n- Tauri + React — React UI is great for the timeline, but capture/encode would\n  require bridging to Windows APIs via `windows-rs` (added complexity).\n- Electron + React — largest ecosystem, but Chromium overhead works against the\n  \"responsive during recording\" success metric.\n- Flutter — weakest native-media story on Windows (needs platform channels).\n\nWindows 11 native API mapping (source of truth for engine tasks):\n- Screen capture 60fps, low overhead → Windows Graphics Capture (WGC) API,\n  frames delivered as Direct3D 11 textures to a DirectX/Direct2D swap chain.\n- Hardware video encode → Media Foundation (NVENC / Intel QSV / AMD AMF).\n- System audio capture → WASAPI loopback on the render endpoint.\n- Microphone capture → WASAPI capture endpoint (+ Voice Capture DSP for AEC /\n  noise suppression / AGC where needed).\n- High-precision cursor tracking → WH_MOUSE_LL low-level mouse hook and/or\n  GetCursorInfo polling, timestamped with QueryPerformanceCounter.\n\nLayered architecture (top → bottom):\n- UI Layer (WinUI 3): recording UI, timeline editor, preview, export dialog.\n- Recording Engine: WGC capture, cursor tracker, WASAPI audio.\n- Processing Pipeline: zoom detection, Catmull-Rom cursor smoothing, effects\n  render (GPU/Direct2D compositing).\n- Export Engine: Media Foundation encode, MP4 (H.264) mux, format/aspect-ratio\n  options, progress + cancellation.\n\nOut of scope for v1: macOS, Linux, iOS-device-recording USB capture, cloud sync."
