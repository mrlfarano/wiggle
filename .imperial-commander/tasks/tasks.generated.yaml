  - id: "008"
    title: "Implement Audio Recording"
    description: "Add microphone and system audio capture.\n\nFeatures:\n- Microphone recording\n- System audio capture (all apps or selected)\n- Background noise reduction\n- Audio normalization\n- Volume level meters\n- Separate audio track control\n\nTechnical approach:\n- Use WASAPI for capture: microphone via the default input endpoint, system audio via WASAPI loopback on the render endpoint (Windows 10+ supports loopback capture cleanly; per-process capture needs an audio-graph/IAudioCaptureClient approach or process injection and is harder)\n- Implement noise gate filter and (optional) AEC/voice processing via Media Foundation Voice Capture DSP (MFPKEY_WMAAFCMA_FORMAT; the Voice Capture DSP provides acoustic-echo cancellation, noise suppression, AGC)\n- Apply compression/normalization (DSP / manual)\n- Sync audio with video timeline using shared high-resolution timestamps\n\nDeliverables:\n- Audio capture module\n- Noise reduction filter\n- Audio level meters\n- Export with mixed audio"
