private IntPtr _hookId = IntPtr.Zero;

public void StartTracking()
{
    var hookProc = HookCallback;
    _hookId = SetWindowsHookEx(
        WH_MOUSE_LL,
        hookProc,
        GetModuleHandle(null),
        0
    );
}

private IntPtr HookCallback(int nCode, IntPtr wParam, IntPtr lParam)
{
    if (nCode >= 0 && wParam == (IntPtr)WM_MOUSEMOVE)
    {
        var mouseHook = Marshal.PtrToStructure<MSLLHOOKSTRUCT>(lParam);
        // Handle event
        HandleMouseEvent(mouseHook);
    }
    return CallNextHookEx(_hookId, nCode, wParam, lParam);
}
\`\`\`

public Point SyncEventToFrame(CursorEvent event, TimeSpan frameTime)
{
    // Interpolate position for exact frame timestamp
    var dt = frameTime - event.Timestamp;
    var velocity = CalculateVelocity(_previousEvent, event);
    return new Point(
        event.Location.X + velocity.X * (float)dt.TotalSeconds,
        event.Location.Y + velocity.Y * (float)dt.TotalSeconds
    );
}

public enum EventType

**Implementation:**
\`\`\`csharp
private CursorEvent HandleMouseEvent(MSLLHOOKSTRUCT hook)
{
    switch ((WM)wParam)
    {
        case WM.LBUTTONDOWN:
            _isDragging = true;
            _dragStart = GetPoint(hook);
            return new CursorEvent(EventType.LeftMouseDown, _dragStart);
        case WM.MOUSEMOVE:
            if (_isDragging)
                return new CursorEvent(EventType.Drag(_dragStart, GetPoint(hook)));
            return new CursorEvent(EventType.Move, GetPoint(hook));
        case WM.LBUTTONUP:
            _isDragging = false;
            return new CursorEvent(EventType.LeftMouseUp, GetPoint(hook));
        case WM.MOUSEWHEEL:
            return new CursorEvent(EventType.Scroll(GetPoint(hook), GetWheelDelta(hook)));
    }
}
\`\`\`

**Use Cases:**
• Click detection for zoom focus points
• Drag detection for zoom regions
• Scroll for potential timeline scrubbing

**Success Criteria:**
• 100% event detection accuracy

Catmull-Rom spline passes through all control points with smooth tangents.

\`\`\`csharp
public class CatmullRomSpline
{
    public IReadOnlyList<Point> Points { get; }
    public float Tension { get; } // 0.0 = loose, 1.0 = tight

    public Point Interpolate(float t)
    {
        var p0 = Points[Math.Max(0, (int)t - 1)];
        var p1 = Points[(int)t];
        var p2 = Points[Math.Min(Points.Count - 1, (int)t + 1)];
        var p3 = Points[Math.Min(Points.Count - 1, (int)t + 2)];

        var t0 = t % 1f;

        // Catmull-Rom interpolation formula
        var s = (1f - Tension) * 0.5f;

        var s2 = s * s;
        var s3 = s2 * s;

        // Calculate interpolated point
        return new Point(
            (2 * p1.X) + (-p0.X + p2.X) * s + (2 * p0.X - 5 * p1.X + 4 * p2.X - p3.X) * s2 + (-p0.X + 3 * p1.X - 3 * p2.X + p3.X) * s3,
            (2 * p1.Y) + (-p0.Y + p2.Y) * s + (2 * p0.Y - 5 * p1.Y + 4 * p2.Y - p3.Y) * s2 + (-p0.Y + 3 * p1.Y - 3 * p2.Y + p3.Y) * s3
        );
    }
}
\`\`\`

• 0.5: Default, balanced
• 1.0: Tight, minimal overshoot

**Scrubbing Strategy:**
\`\`\`csharp
public class ScrubbingEngine
{
    private readonly FrameCache _frameCache;
    private Task? _preloadTask;

    public async Task<SoftwareBitmap?> SeekAsync(TimeSpan time)
    {
        // Check cache first
        if (_frameCache.TryGetValue(time, out var frame))
            return frame;

        // Load frame from storage
        frame = await LoadFrameAsync(time);
        _frameCache[time] = frame;

        // Preload nearby frames
        PreloadNearby(time);

        return frame;
    }

    private void PreloadNearby(TimeSpan time)
    {
        _preloadTask?.Cancel(); // Cancel previous preload
        _preloadTask = Task.Run(async () =>
        {
            foreach (var offset in new[] { -1, 1, -2, 2 })
            {
                var t = time + TimeSpan.FromSeconds(offset / 60.0);
                await LoadFrameAsync(t);
            }
        });
    }
}
\`\`\`

• LRU cache for recent frames
• Predictive preloading based on scrub direction
• I/O bound operations on background thread

**Success Criteria:**
• 60fps smooth scrubbing
• <100ms seek latency
• No frame drops

    public void Trim(TimeSpan from, TimeSpan to)

        _undoStack.Push(command);
        _redoStack.Clear();

            _redoStack.Push(command);

            command.Execute();
            _undoStack.Push(command);
        }
    }

        let currentFilter = 'all';

        function createTaskCard(task) {
            const card = document.createElement('div');
            card.className = 'task-card';
            card.draggable = true;
            card.dataset.taskId = task.id;

            const blockedBy = task.blocked.length > 0 ? task.blocked.join(', ') : 'None';
            const isBlocked = task.blocked.length > 0;

            card.innerHTML = `
                <span class="phase-tag phase-${task.phase}">Phase ${task.phase}</span>
                <div class="task-id">#${task.id}</div>
                <div class="task-title">${task.title}</div>
                <div class="task-desc">${task.desc}</div>
                <div class="meta">
                    <span class="priority-p${task.priority.toLowerCase().replace('P', '')}">${task.priority}</span>
                    <span class="complexity-${task.complexity.toLowerCase()}">${task.complexity}</span>
                    <span class="blocked-by">${isBlocked ? '🔒 ' + blockedBy : '✅ Ready'}</span>
                </div>
            `;

            card.addEventListener('dragstart', (e) => {
                card.classList.add('dragging');
                e.dataTransfer.setData('text/plain', task.id);
            });

            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
            });

            card.addEventListener('click', () => openModal(task));

            return card;
        }

        function renderTasks() {
            const backlog = document.getElementById('backlog-tasks');
            const progress = document.getElementById('progress-tasks');
            const done = document.getElementById('done-tasks');

            backlog.innerHTML = '';
            progress.innerHTML = '';
            done.innerHTML = '';

            let backlogCount = 0, progressCount = 0, doneCount = 0;

            // Filter and render tasks
            const filteredTasks = currentFilter === 'all'
                ? tasks
                : tasks.filter(t => t.phase === currentFilter);

            filteredTasks.forEach(task => {
                const card = createTaskCard(task);
                backlog.appendChild(card);
                backlogCount++;
            });

            document.getElementById('backlog-count').textContent = backlogCount;
            document.getElementById('progress-count').textContent = progressCount;
            document.getElementById('done-count').textContent = doneCount;

            // Update stats
            const total = filteredTasks.length;
            const blocked = filteredTasks.filter(t => t.blocked.length > 0).length;
            document.getElementById('stats').textContent =
                `${total} tasks ${currentFilter !== 'all' ? '(filtered) ' : ''}• ${blocked} blocked • ${total - blocked} actionable`;
        }

        function openModal(task) {
            const modal = document.getElementById('modal-overlay');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');

            const phaseNames = {
                '0': 'Foundation',
                '1': 'Recording',
                '5': 'Export',
                '2': 'Smoothing',
                '3': 'Auto-Zoom',
                '4': 'Timeline',
                '6': 'Polish'
            };

            const complexityClass = `complexity-badge-${task.complexity.toLowerCase()}`;

            title.innerHTML = `
                Task #${task.id}: ${task.title}
                <span class="modal-header-complexity ${complexityClass}">${task.complexity}</span>
            `;

            // Parse details and convert markdown-like formatting to HTML
            const formattedDetails = task.details
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/`([^`]+)`/g, '<code style="background: #404040; padding: 2px 6px; border-radius: 4px;">$1</code>')
                .replace(/\n/g, '<br>')
                .replace(/• /g, '&bull; ')
                .replace(/\| /g, '<span style="margin-right: 20px;">| </span>');

            const depsHtml = task.blocked.length === 0
                ? '<div class="modal-dependencies empty">✅ No dependencies - this task can be started!</div>'
                : '<div class="modal-dependencies has-deps">🔒 Blocked by tasks: #' + task.blocked.join(', #') + '</div>';

            body.innerHTML = `

                    <div class="modal-label">Phase:</div>
                    <div class="modal-value">Phase ${task.phase} - ${phaseNames[task.phase]}</div>
                </div>
                <div class="modal-row">
                    <div class="modal-label">Priority:</div>
                    <div class="modal-value priority-p${task.priority.toLowerCase().replace('P', '')}">${task.priority}</div>

                <div class="modal-row">
                    <div class="modal-label">Complexity:</div>
                    <div class="modal-value complexity-${task.complexity.toLowerCase()}">${task.complexity}</div>
                </div>
                <div class="modal-desc">
                    <strong>Summary:</strong><br>${task.desc}

                ${depsHtml}
                <div class="modal-desc" style="margin-top: 16px; max-height: 400px; overflow-y: auto;">
                    ${formattedDetails}
                </div>
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('modal-overlay');
            modal.classList.remove('active');

        // Close modal when clicking outside
        document.getElementById('modal-overlay').addEventListener('click', (e) => {

            });
        });

        function allowDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function drop(e) {
            e.preventDefault();
            const column = e.currentTarget;
            column.classList.remove('drag-over');

            const taskId = e.dataTransfer.getData('text/plain');
            const card = document.querySelector(`[data-task-id="${taskId}"]`);

            if (card && column.classList.contains('column')) {
                const tasksContainer = column.querySelector('.tasks') || column;
                tasksContainer.appendChild(card);

                // Update status based on column
                if (column.id === 'backlog') updateStatus(taskId, 'pending');
                else if (column.id === 'in-progress') updateStatus(taskId, 'in-progress');
                else if (column.id === 'done') updateStatus(taskId, 'done');

                updateColumnCounts();
            }
        }

        function updateStatus(taskId, newStatus) {
            // In a real implementation, this would call TaskUpdate
            console.log(`Task #${taskId} → ${newStatus}`);
        }

        function updateColumnCounts() {
            ['backlog', 'progress', 'done'].forEach(col => {
                const container = document.getElementById(`${col}-tasks`);
                const count = container.children.length;
                document.getElementById(`${col}-count`).textContent = count;
            });
        }

        // Initialize
        renderTasks();

        // Make columns droppable
        document.querySelectorAll('.column').forEach(column => {
            column.addEventListener('dragover', allowDrop);
            column.addEventListener('drop', drop);
            column.addEventListener('dragleave', () => {
                column.classList.remove('drag-over');
            });
        });
